<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Teacher Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: HUD on top, order rail of tickets under it, the school campus map as the play field. */
  --ink:#1B2A41; --paper:#FFFFFF; --sky:#D5EBFA; --grass:#C6E5AE; --path:#EFE6D0; --bus:#FFC21A;
  --energy:#2EA66B; --warn:#F2A900; --crit:#E5383B; --tpi:#E0409B; --work:#3B82F6; --muted:#55657E;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{box-sizing:border-box;overflow:auto;background:var(--sky);color:var(--ink);font:700 15px/1.4 var(--body);padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* one fitted screen: the map takes whatever height the HUD and rail leave over */
.app{height:100%;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 clamp(28px,6vw,40px)/1 var(--display);margin:0;letter-spacing:.5px;text-shadow:0 3px 0 rgba(27,42,65,.15)}
h1 span{color:#F0642F}
.btns{display:flex;gap:8px}
.ib{width:42px;height:42px;border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:22px;height:22px}
button:focus-visible,.st:focus-visible{outline:3px solid var(--work);outline-offset:2px}
.hud{display:grid;grid-template-columns:.9fr 1.3fr 1.3fr .9fr;gap:10px}
@media(max-width:640px){.hud{grid-template-columns:1fr 1fr}}
.tile{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 12px 10px;min-width:0}
.lbl{display:flex;align-items:center;gap:6px;font:800 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lbl svg{width:22px;height:22px;flex:none}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.big{font:400 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:800 12px var(--body);color:var(--muted);margin-left:3px}
.meter{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#E6EAF0;overflow:hidden;margin-top:6px;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:50%;border-radius:99px;background:var(--energy);transition:width .15s linear,background .2s}
.meter i::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.meter.low{animation:pulse .7s ease-in-out infinite}
.chip{display:inline-block;font:400 13px var(--display);background:var(--bus);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
.railwrap{background:rgba(255,255,255,.55);border:2.5px dashed rgba(27,42,65,.35);border-radius:14px;padding:8px 8px 4px}
.rail{display:flex;gap:8px;overflow-x:auto;min-height:80px;padding:2px 2px 8px;align-items:stretch}
.empty{align-self:center;color:var(--muted);font-weight:800;padding:0 6px}
.tk{flex:0 0 156px;display:flex;flex-direction:column;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:var(--ink);box-shadow:0 3px 0 var(--ink);animation:drop .3s ease-out}
.tk.on{outline:3px solid var(--work);outline-offset:1px}
.tk.crit{animation:shake .5s ease-in-out infinite}
.tk.out{animation:out .45s ease-in forwards;pointer-events:none}
.tk.bad{border-color:var(--crit)}
.tk-h{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--c);color:var(--on)}
.tk-h svg{width:32px;height:32px;flex:none;padding:4px;box-sizing:border-box;background:rgba(255,255,255,.22);border-radius:9px}
.tk-h b{font:400 14px/1.05 var(--display);min-width:0}
.tk-b{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px 5px;flex:1}
.tk-b small{font-size:11px;font-weight:800;color:var(--muted);line-height:1.15}
.tk-time{font:400 19px var(--display);font-variant-numeric:tabular-nums}
.tk-b small{font-size:10.5px}
.tk-b{padding:3px 6px 3px}
.bar{display:block;height:7px;background:#E6EAF0;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--energy)}
.bar.w{height:5px}.bar.w i{width:0;background:var(--work)}
.tk.warn .bar.t i{background:var(--warn)}.tk.crit .bar.t i{background:var(--crit)}
.map{flex:1;min-height:260px;display:flex;background:var(--grass);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.map svg{display:block;flex:1;width:100%;height:100%;min-height:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.top,.hud,.railwrap,.status,.hint{flex:none}
@media(max-height:780px){.hint{display:none}.tile{padding:6px 10px 8px}.big{font-size:24px}h1{font-size:28px}}
.hint{display:none}
.railwrap{padding:5px 6px 1px}
.status{padding:4px 10px;font-size:15px;min-height:0}
.empty{font-size:13px}
.hint{margin:0;color:var(--muted);font-size:13px}
.status{margin:0;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;font:400 17px var(--display);min-height:24px}
.o{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.o2{stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.at{font-family:var(--display);fill:var(--ink)}
.pl{font:400 17px var(--display)}
.st{cursor:pointer;outline:none}
.st .glow{fill:none;stroke:var(--bus);stroke-width:5;opacity:0}
.st.has .glow{opacity:1}
.st.crit .glow{stroke:var(--crit);animation:pulse .6s ease-in-out infinite}
.st:hover .card{filter:brightness(1.05)}
.st:focus-visible .glow{opacity:1;stroke:var(--work)}
.pt{font:400 17px var(--display);fill:var(--ink);text-anchor:middle}
.sg{font:400 24px var(--display);fill:#fff;text-anchor:middle}
.fx{font:400 18px var(--display);paint-order:stroke;stroke:var(--ink);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none;animation:rise 1.2s ease-out forwards}
.fx.good{fill:#fff}.fx.bad{fill:#FF8A8A}.fx.sip{fill:#FFE066}
.tch{pointer-events:none}
.tch .mouth-t,.tch .sweat{display:none}
.tch.tired .mouth-t,.tch.tired .sweat{display:inline}
.tch.tired .mouth-s{display:none}
.leg{transform-box:fill-box;transform-origin:50% 0}
.tch.walk .bob{animation:bob .32s ease-in-out infinite}
.tch.walk .leg.l{animation:step .32s linear infinite}
.tch.walk .leg.r{animation:step .32s linear infinite reverse}
.arm{transform-box:fill-box;transform-origin:0 0}
.tch.work .arm.r{animation:write .35s ease-in-out infinite}
.tch.cheer .bob{animation:jump .5s ease-out}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(27,42,65,.6);z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);max-width:460px;width:100%;padding:20px;max-height:100%;overflow:auto}
.panel h2{font:400 36px/1 var(--display);margin:0 0 6px}
.panel p{margin:0;color:var(--muted)}
.rules{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-width:0}
.rb{width:34px;height:34px;border-radius:10px;border:2.5px solid var(--ink);display:grid;place-items:center;color:#fff}
.rb svg{width:20px;height:20px}
.go{width:100%;font:400 22px var(--display);padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--bus);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;margin-top:8px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.go.alt{background:var(--paper)}
.stars{display:flex;gap:6px;margin:10px 0}
.stars svg{width:44px;height:44px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:#EEF4FA;border-radius:10px;padding:8px 10px;min-width:0}
.stats b{display:block;font:400 22px var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes pulse{50%{opacity:.45}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes out{to{transform:translateY(16px) scale(.9);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes step{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes write{50%{transform:rotate(-14deg)}}
@keyframes jump{40%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main class="app">
  <div class="top">
    <h1>NIS Teacher <span>Rush</span></h1>
    <div class="btns">
      <button class="ib" id="btnFs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" id="btnSnd" type="button" aria-label="Mute sound"></button>
      <button class="ib" id="btnPause" type="button" aria-label="Pause"></button>
    </div>
  </div>
  <section class="hud" aria-label="Status">
    <div class="tile"><div class="lbl"><svg><use href="#i-clock"/></svg>NIS 7:20 – 3:00</div>
      <div class="row"><span class="big"><span id="clock">7:20</span><small id="ampm">AM</small></span></div>
      <div class="meter"><i id="dayFill" style="background:var(--work);width:0"></i></div></div>
    <div class="tile"><div class="lbl" style="color:var(--energy)"><svg><use href="#i-bolt"/></svg>Energy</div>
      <div class="row"><span class="big"><span id="enVal">100</span><small>/ 100</small></span></div>
      <div class="meter" id="enMeter"><i id="enFill" style="width:100%"></i></div></div>
    <div class="tile"><div class="lbl" style="color:var(--tpi)"><svg><use href="#i-star"/></svg>TPI motivation</div>
      <div class="row"><span class="big"><span id="tpiVal">60</span><small>/ 100</small></span></div>
      <div class="meter" id="tpiMeter"><i id="tpiFill" style="background:var(--tpi);width:60%"></i></div></div>
    <div class="tile"><div class="lbl"><svg><use href="#i-trophy"/></svg>Score</div>
      <div class="row"><span class="big" id="score">0</span><span class="chip" id="combo" hidden>x2</span></div>
      <div class="lbl" style="margin-top:8px"><span id="doneTxt">0 of 17 done</span></div></div>
  </section>
  <section class="railwrap" aria-label="Task tickets"><div class="rail" id="rail"></div></section>
  <div class="map"><svg id="map" viewBox="0 0 800 450" role="group" aria-label="School campus"></svg></div>
  <p class="status" id="status">Tap a ticket or a glowing room.</p>
  <p class="hint">Tap a ticket and the teacher finishes that task in one second. Each task costs some energy, so tap the Coffee Corner to refill it.</p>
  <div class="vh" id="live" aria-live="polite"></div>
</main>

/* ---- sound ---- */
function tone(f,d,type,v,delay){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.05,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  ping(){tone(880,.12,'triangle',.05)},
  done(){tone(660,.1,'sine',.06);tone(990,.16,'sine',.06,.09)},
  miss(){tone(220,.3,'sawtooth',.04)},
  sip(){tone(500,.08,'sine',.04)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.06,i*.12))},
  lose(){[330,262,196].forEach((f,i)=>tone(f,.25,'sawtooth',.04,i*.18))}
};

/* ---- helpers ---- */
function say(t){$('#live').textContent=t}
function floatTxt(x,y,txt,cls){
  const e=document.createElementNS('http://www.w3.org/2000/svg','text');
  e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('class','fx '+cls);e.textContent=txt;
  e.addEventListener('animationend',()=>e.remove());$('#fx').appendChild(e);
}
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---- game flow ---- */
function start(day){
  const scale=Math.max(.7,1-.08*(day-1));
  G={day,t:0,mps:6+.6*(day-1),energy:100,tpi:60,score:0,combo:0,bestCombo:0,done:0,missed:0,paused:false,over:false,
    tickets:SCHED.map((s,i)=>({id:i,k:s[0],at:s[1],win:Math.round(s[2]*scale),due:s[1]+Math.round(s[2]*scale),work:WORK_SECONDS,prog:0,status:'wait'}))};
  P={x:400,y:385,tx:400,ty:385,mode:'idle',moving:false,at:null,cur:null,drink:0,dir:1,cheer:0};
  for(const k in tkEls){tkEls[k].remove();delete tkEls[k]}
  $('#fx').innerHTML='';
  $('#btnPause').innerHTML=ICON_PAUSE;
  $('#ov').hidden=true;last=0;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
  render();say('Day '+day+' begins. Morning duty is up.');
}
function go(id){
  if(!G||G.over||G.paused)return;
  const s=STN[id];
  if(id==='coffee'){
    if(P.mode!=='drink'){P.mode='drink';P.cur=null;P.drink=0;sfx.sip()}
    P.at=id;P.tx=s.x+44;P.ty=s.y+50;return;
  }
  const tk=nextAt(id);
  if(!tk){floatTxt(s.x,s.y-40,'No task here yet','sip');return}
  startTask(tk);
}
function startTask(tk){
  if(!G||G.over||G.paused||tk.status!=='active')return;
  const st=TASKS[tk.k].st,s=STN[st];
  if(P.cur!==tk)sfx.sip();
  P.mode='work';P.cur=tk;P.at=st;P.tx=s.x+44;P.ty=s.y+50;
}
function nextAt(st){
  let b=null;
  for(const tk of G.tickets)if(tk.status==='active'&&TASKS[tk.k].st===st&&(!b||tk.due<b.due))b=tk;
  return b;
}
function complete(tk){
  const S=STN[TASKS[tk.k].st],frac=Math.max(0,(tk.due-G.t)/tk.win);
  tk.status='done';G.done++;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);
  const gain=4+Math.round(frac*4)+Math.min(G.combo-1,3);
  G.tpi=Math.min(100,G.tpi+gain);
  const pts=100+Math.round(frac*100)+G.combo*10;G.score+=pts;
  const cost=TASKS[tk.k].cost;G.energy=Math.max(0,G.energy-cost);
  floatTxt(S.x,S.y-60,'+'+gain+' TPI','good');floatTxt(S.x,S.y-36,'+'+pts,'good');floatTxt(S.x,S.y-12,'-'+cost+' energy','sip');
  leave(tk,'');sfx.done();P.mode='idle';P.cur=null;P.cheer=.5;
  say(TASKS[tk.k].title+' done on time.');
}
function miss(tk){
  const S=STN[TASKS[tk.k].st];
  tk.status='missed';G.missed++;G.combo=0;G.tpi=Math.max(0,G.tpi-12);
  floatTxt(S.x,S.y-50,'-12 TPI','bad');leave(tk,'bad');sfx.miss();
  if(P.cur===tk){P.mode='idle';P.cur=null}
  say('Missed: '+TASKS[tk.k].title+'.');
}
function leave(tk,cls){
  const el=tkEls[tk.id];if(!el)return;
  delete tkEls[tk.id];el.classList.add('out');if(cls)el.classList.add(cls);
  setTimeout(()=>el.remove(),460);
}

function update(dt){
  G.t+=dt*G.mps;
  for(const tk of G.tickets){
    if(tk.status==='wait'&&G.t>=tk.at){tk.status='active';sfx.ping();say('New task: '+TASKS[tk.k].title)}
    if(tk.status==='active'&&G.t>=tk.due)miss(tk);
  }
  let drain=.2;
  {
    const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),step=480*dt;
    P.moving=d>1;
    if(P.moving){
      if(Math.abs(dx)>1)P.dir=dx>0?1:-1;
      if(d<=step){P.x=P.tx;P.y=P.ty}else{P.x+=dx/d*step;P.y+=dy/d*step}
    }
  }
  if(P.mode==='work'){
    const tk=P.cur;
    if(!tk||tk.status!=='active'){P.mode='idle';P.cur=null}
    else{tk.prog+=dt;if(tk.prog>=tk.work)complete(tk)}
  }
  if(P.mode==='drink'){
    P.drink+=dt;G.energy=Math.min(100,G.energy+40*dt/1.5);drain=0;
    if(P.drink>=1.5){P.mode='idle';G.tpi=Math.min(100,G.tpi+1.5)}
  }
  G.energy=Math.max(0,G.energy-drain*dt);
  if(G.energy<22)G.tpi=Math.max(0,G.tpi-.3*dt);
  if(P.cheer>0)P.cheer-=dt;
  if(G.tpi<=0)return end('burnout');
  if(G.t>=DAY_END)return end('done');
}

/* ---- rendering ---- */
function mkTicket(tk){
  const T=TASKS[tk.k],S=STN[T.st],b=document.createElement('button');
  b.type='button';b.className='tk';b.style.setProperty('--c',S.col);b.style.setProperty('--on',S.on);
  b.innerHTML=`<span class="tk-h"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-${S.ic}"/></svg><b>${T.title}</b></span><span class="tk-b"><small>${T.sub}</small><span class="tk-time">0s</span></span><span class="bar t"><i></i></span><span class="bar w"><i></i></span>`;
  b.addEventListener('pointerdown',()=>startTask(tk));
  b.addEventListener('click',()=>startTask(tk));
  return b;
}
function render(){
  if(!G)return;
  const tch=$('#tch');
  tch.setAttribute('transform',`translate(${P.x.toFixed(1)} ${P.y.toFixed(1)})`);
  $('#flip').setAttribute('transform',`scale(${P.dir*.9} .9)`);
  tch.setAttribute('class','tch'+(P.moving?' walk':'')+(P.mode==='work'?' work':'')+(G.energy<25?' tired':'')+(P.cheer>0?' cheer':''));
  const tm=$('#tm'),showM=P.mode==='work'||P.mode==='drink';
  tm.style.display=showM?'':'none';
  if(showM){
    const fr=P.mode==='work'?P.cur.prog/P.cur.work:P.drink/2.4;
    $('#tmf').setAttribute('width',Math.min(1,fr)*40);
    $('#tmf').setAttribute('fill',P.mode==='work'?'#3B82F6':'#8B5E3C');
  }
  let st='Tap a ticket to start that task.';
  if(P.mode==='work')st='Working: '+TASKS[P.cur.k].title+' ('+Math.round(Math.min(1,P.cur.prog/P.cur.work)*100)+'%)';
  else if(P.mode==='drink')st='Drinking coffee...';
  const sEl=$('#status');if(sEl.textContent!==st)sEl.textContent=st;
  /* stations */
  const act=G.tickets.filter(t=>t.status==='active');
  for(const id in STN){
    const list=act.filter(t=>TASKS[t.k].st===id),g=$('#st-'+id),pin=$('#pin-'+id);
    g.classList.toggle('has',list.length>0);
    if(!list.length){g.classList.remove('crit');pin.style.display='none';continue}
    const u=list.reduce((a,b)=>a.due<b.due?a:b),fr=Math.max(0,(u.due-G.t)/u.win);
    g.classList.toggle('crit',fr<.25);pin.style.display='';
    const r=$('#pr-'+id);
    r.setAttribute('stroke-dashoffset',(100.53*(1-fr)).toFixed(1));
    r.setAttribute('stroke',fr>.5?'#2EA66B':fr>.25?'#F2A900':'#E5383B');
    $('#pt-'+id).textContent=Math.ceil((u.due-G.t)/G.mps);
  }
  /* tickets */
  const rail=$('#rail');
  for(const tk of act){
    let el=tkEls[tk.id];
    if(!el){el=tkEls[tk.id]=mkTicket(tk);rail.appendChild(el)}
    const fr=Math.max(0,(tk.due-G.t)/tk.win);
    el.classList.toggle('warn',fr<=.5&&fr>.25);el.classList.toggle('crit',fr<=.25);
    el.classList.toggle('on',P.cur===tk&&P.mode==='work');
    el.querySelector('.tk-time').textContent=Math.ceil((tk.due-G.t)/G.mps)+'s';
    el.querySelector('.bar.t i').style.width=(fr*100)+'%';
    el.querySelector('.bar.w i').style.width=Math.min(100,tk.prog/tk.work*100)+'%';
  }
  let em=rail.querySelector('.empty');
  if(!act.length&&!rail.querySelector('.tk')){
    if(!em){em=document.createElement('div');em.className='empty';rail.appendChild(em)}
    const nx=G.tickets.find(t=>t.status==='wait');
    em.textContent=nx?'No tasks right now. Grab a coffee before the next bell.':'All tasks handled.';
  }else if(em&&act.length)em.remove();
  /* HUD */
  const mins=DAY_START+G.t,h=Math.floor(mins/60),m=Math.floor(mins%60),h12=((h+11)%12)+1;
  $('#clock').textContent=h12+':'+String(m).padStart(2,'0');$('#ampm').textContent=h<12?'AM':'PM';
  $('#dayFill').style.width=Math.min(100,G.t/DAY_END*100)+'%';
  const en=Math.round(G.energy);$('#enVal').textContent=en;
  const ef=$('#enFill');ef.style.width=en+'%';ef.style.background=en>50?'var(--energy)':en>25?'var(--warn)':'var(--crit)';
  $('#enMeter').classList.toggle('low',en<25);
  const tp=Math.round(G.tpi);$('#tpiVal').textContent=tp;$('#tpiFill').style.width=tp+'%';$('#tpiMeter').classList.toggle('low',tp<25);
  $('#score').textContent=fmt(G.score);
  const cb=$('#combo');cb.hidden=G.combo<2;cb.textContent='x'+G.combo+' streak';
  $('#doneTxt').textContent=G.done+' of '+G.tickets.length+' done';
}
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!G||G.over)return;
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(G.paused)return;
  update(dt);render();
}

/* ---- overlays ---- */
function showOv(html){$('#panel').innerHTML=html;$('#ov').hidden=false}
const STAR=on=>`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l4.2 8.8 9.8 1.2-7.2 6.7 1.9 9.6L16 23.3l-8.7 5 1.9-9.6L2 12l9.8-1.2z" fill="${on?'#FFC21A':'#E6EAF0'}" stroke="#1B2A41" stroke-width="2" stroke-linejoin="round"/></svg>`;
function introHtml(){
  const li=(c,ic,t)=>`<li><span class="rb" style="background:${c}"><svg viewBox="0 0 32 32"><use href="#i-${ic}"/></svg></span><span>${t}</span></li>`;
  return `<h2>NIS Teacher Rush</h2><p>Run a school day at NIS from 7:20 AM to 3:00 PM. Every task has a deadline.</p><ul class="rules">
${li('#3B82F6','gate','Tap a ticket and the teacher finishes that task in one second.')}
${li('#2EA66B','bolt','Each finished task costs energy. Tap the Coffee Corner to refill it.')}
${li('#E0409B','star','On-time tasks raise your TPI motivation. A missed task costs 12. At zero you burn out.')}</ul>
<button class="go" type="button" data-act="start">Start the day</button>${best?`<p style="text-align:center;margin-top:10px">Best score: ${fmt(best)}</p>`:''}`;
}
function end(kind){
  G.over=true;
  let stars=0;
  if(kind==='done')stars=(G.tpi>=70&&G.missed<=1)?3:(G.tpi>=40&&G.missed<=4)?2:1;
  const nb=G.score>best;if(nb){best=G.score;try{localStorage.setItem('teacherRushBest',best)}catch(e){}}
  kind==='done'?sfx.win():sfx.lose();
  const title=kind==='done'?'School is out!':'Burnout!';
  const msg=kind==='done'?(stars===3?'A flawless day. The students barely noticed the rush.':stars===2?'A solid day with a few things slipping.':'You survived the day. Tomorrow will be better.'):'Your motivation hit zero before the final bell.';
  showOv(`<h2>${title}</h2><p>${msg}</p><div class="stars" role="img" aria-label="${stars} of 3 stars">${STAR(stars>0)}${STAR(stars>1)}${STAR(stars>2)}</div>
<div class="stats"><div><b>${G.done} / ${G.tickets.length}</b><span>On time</span></div><div><b>${G.missed}</b><span>Missed</span></div><div><b>${Math.round(G.tpi)}</b><span>Final TPI</span></div><div><b>x${G.bestCombo}</b><span>Best streak</span></div><div style="grid-column:1/-1"><b>${fmt(G.score)}</b><span>Score${nb?' · new best':''}</span></div></div>
${kind==='done'?'<button class="go" type="button" data-act="next">Next day (faster)</button><button class="go alt" type="button" data-act="retry">Replay this day</button>':'<button class="go" type="button" data-act="retry">Try again</button>'}`);
}
function setPause(p){
  if(!G||G.over)return;
  G.paused=p;$('#btnPause').innerHTML=p?ICON_PLAY:ICON_PAUSE;$('#btnPause').setAttribute('aria-label',p?'Resume':'Pause');
  if(p)showOv('<h2>Paused</h2><p>The bell waits for no one, but this one will.</p><button class="go" type="button" data-act="resume">Resume</button>');
  else{$('#ov').hidden=true;last=0}
}

/* ---- wiring ---- */
buildMap();
$('#btnSnd').innerHTML=ICON_SND;
$('#btnSnd').addEventListener('click',()=>{muted=!muted;$('#btnSnd').innerHTML=muted?ICON_MUTE:ICON_SND;$('#btnSnd').setAttribute('aria-label',muted?'Unmute sound':'Mute sound')});
$('#btnFs').addEventListener('click',()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}
  }catch(e){}
});
$('#btnPause').innerHTML=ICON_PAUSE;
$('#btnPause').addEventListener('click',()=>setPause(!(G&&G.paused)));
$('#map').addEventListener('pointerdown',e=>{const s=e.target.closest('.st');if(s){e.preventDefault();go(s.dataset.st)}});
$('#map').addEventListener('click',e=>{const s=e.target.closest('.st');if(s)go(s.dataset.st)});
$('#map').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const s=e.target.closest('.st');if(s){e.preventDefault();go(s.dataset.st)}}});
$('#panel').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const k=a.dataset.act;
  if(k==='start')start(1);else if(k==='next')start(G.day+1);else if(k==='retry')start(G?G.day:1);else if(k==='resume')setPause(false);
});
document.addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P')&&G&&!G.over)setPause(!G.paused)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.paused)setPause(true)});
G=null;P={x:400,y:385,mode:'idle',dir:1,cheer:0};
$('#tch').setAttribute('transform','translate(400 385)');$('#flip').setAttribute('transform','scale(.9 .9)');
showOv(introHtml());
</script>

</body></html>
